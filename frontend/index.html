<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM AutoTune</title>
    <!-- Shown until the app has loaded and mounts over it: on a slow link the
         scripts take a while, and an empty white page reads as broken. Plain
         CSS, no script, so it shows as soon as this file arrives. -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        font: 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #64748b; background: #f8fafc; }
      .boot-spin { width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid #e2e8f0; border-top-color: #0f766e;
        animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot"><div class="boot-spin"></div>LLM AutoTune</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
