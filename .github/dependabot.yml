version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: gomod
    directory: /operator
    schedule:
      interval: weekly
    groups:
      k8s:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

# No docker entry. The backend, frontend and mock-engine images take their
# base images as build args, which Dependabot cannot follow. The operator's
# are literal, but golang:1.26 follows operator/go.mod and is moved by hand
# with it, and distroless/static:nonroot is a floating tag.
# No gitsubmodule entry either: the policies pointer moves together with the
# change that needs it.
