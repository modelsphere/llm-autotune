name: policies

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk-copies-match:
    # Each policy repository vendors autotune_policy/ verbatim, because a policy
    # image must build with no package index reachable. policies/autotune_policy/
    # is the copy of record; this job is what stops the copies drifting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: The vendored SDKs are identical to the copy of record
        run: |
          fail=0
          for policy in policies/random-search policies/chaos; do
            if ! diff -ru --exclude=__pycache__ \
                 policies/autotune_policy "$policy/autotune_policy"; then
              echo "::error::$policy/autotune_policy has drifted from policies/autotune_policy"
              echo "::error::run scripts/sync-policy-sdk.sh, then commit in the submodule"
              fail=1
            fi
          done
          exit $fail

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        policy: [random-search, chaos]
    defaults:
      run:
        working-directory: policies/${{ matrix.policy }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      # A full night against an in-memory platform: no network, no GPUs.
      - run: uv run --extra dev pytest -q
      - run: uv run --extra dev ruff check .

  image:
    # Each policy vendors the SDK, so its own directory is the build context.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        policy: [random-search, chaos]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: docker build policies/${{ matrix.policy }}
