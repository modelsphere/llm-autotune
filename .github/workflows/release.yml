name: release

# A version tag builds the two images the chart deploys and pushes them to Docker
# Hub, as the other modelsphere components do.
#
#   v0.1.0      -> 4pdosc/<image>:0.1.0 and 4pdosc/<image>:latest
#   v0.1.0-rc1  -> 4pdosc/<image>:0.1.0-rc1 only; a candidate never takes latest
#
# The mock engine, the operator and the policies are built from source by
# whoever uses them (deploy/quickstart.sh builds the first and loads it into the
# cluster); none of them is published.
#
# Credentials are the org secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The chart installs its appVersion when image.tag is empty, so a tag that
      # disagrees would publish one build and install another. Fail here, before
      # anything is pushed. A prerelease is compared by its version core, so
      # 0.1.0-rc1 rehearses 0.1.0.
      - id: check
        name: The tag agrees with the chart
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          core="${version%%-*}"
          chart=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' deploy/helm/llm-autotune/Chart.yaml)
          if [ "$core" != "$chart" ]; then
            echo "::error::tag $GITHUB_REF_NAME != chart appVersion $chart; bump deploy/helm/llm-autotune/Chart.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "$core" ]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: llm-autotune-backend
            context: backend
            dockerfile: deploy/docker/Dockerfile.backend
          - name: llm-autotune-frontend
            context: frontend
            dockerfile: deploy/docker/Dockerfile.frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tags
        name: Image tags
        run: |
          set -eu
          image="docker.io/4pdosc/${{ matrix.name }}"
          {
            echo "tags<<TAGS_EOF"
            echo "$image:${{ needs.version.outputs.version }}"
            if [ "${{ needs.version.outputs.latest }}" = true ]; then echo "$image:latest"; fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
