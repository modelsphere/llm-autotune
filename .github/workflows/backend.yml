name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q

  schema:
    # The suite runs on SQLite; the schema has to be right on the database the
    # platform actually deploys against.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autotune
          POSTGRES_PASSWORD: autotune
          POSTGRES_DB: autotune
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autotune"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTOTUNE_SYNC_DATABASE_URL: postgresql+psycopg2://autotune:autotune@localhost:5432/autotune
      AUTOTUNE_DATABASE_URL: postgresql+asyncpg://autotune:autotune@localhost:5432/autotune
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --extra dev
      - name: Migrate a fresh database
        run: uv run alembic upgrade head
      - name: The models and the migrations agree
        run: uv run alembic check

  plugins:
    # The plugin API, held to its word: the example plugin under
    # tests/plugins/example uses every hook, so a change that would break a
    # plugin breaks it here, in the pull request that makes it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autotune
          POSTGRES_PASSWORD: autotune
          POSTGRES_DB: autotune
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autotune"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv pip install -e tests/plugins/example
      - name: The example imports from the platform only through app.plugin_api
        run: uv run ruff check tests/plugins/example
      - name: Installing a plugin changes nothing until it is enabled
        run: uv run pytest -q
      - name: The plugin API's contract, with the example enabled
        env:
          AUTOTUNE_PLUGINS: example
        run: uv run pytest -q tests/plugins
      - name: Bootstrap a fresh database, the plugin's schema included
        env:
          AUTOTUNE_SYNC_DATABASE_URL: postgresql+psycopg2://autotune:autotune@localhost:5432/autotune
          AUTOTUNE_DATABASE_URL: postgresql+asyncpg://autotune:autotune@localhost:5432/autotune
          AUTOTUNE_LLMBENCH_ENSURE_BENCHMARKS: "false"
          AUTOTUNE_PLUGINS: example
        run: |
          uv run python -m app.db.bootstrap
          uv run python -m app.db.bootstrap   # every deploy runs it again
      - name: Each migration history agrees with its own models, and only its own
        env:
          AUTOTUNE_SYNC_DATABASE_URL: postgresql+psycopg2://autotune:autotune@localhost:5432/autotune
        run: |
          uv run alembic check
          uv run python - <<'PY'
          from alembic import command
          from alembic.config import Config

          config = Config()
          config.set_main_option(
              "script_location", "tests/plugins/example/example_plugin/migrations"
          )
          command.check(config)
          PY
