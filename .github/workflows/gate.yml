name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LICENSE is the Apache-2.0 text, unmodified
        run: |
          if ! grep -q "Apache License" LICENSE || ! grep -q "Version 2.0, January 2004" LICENSE; then
            echo "::error file=LICENSE::LICENSE is not the Apache-2.0 text."
            exit 1
          fi

  no-internal-references:
    # Checked out without submodules on purpose: each policy repository runs
    # this same check on its own tree, and their workflow files contain the
    # pattern itself.
    #
    # This repository was extracted from an internal one. Names of internal
    # hosts, registries, clusters and machines are not secrets, but they are
    # noise to every reader and a slow leak of how someone else's network is
    # laid out. Catch them here rather than in review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No internal hosts, registries or identifiers
        run: |
          pattern='4pd\.io|4paradigm|hardcore-tech|inference-production-stack|llmbench\.internal|harbor\.|pce-dev|wlcbhb|hhht'
          if grep -rInE "$pattern" . \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv \
               --exclude=gate.yml; then
            echo "::error::internal identifier found — see the matches above"
            exit 1
          fi
      - name: No removed subsystems left behind
        run: |
          pattern='baseline_hub|BaselineHub|baseline-hub|contest_api_token|PLANNER_REGISTRY'
          if grep -rInE "$pattern" . \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv \
               --exclude=gate.yml; then
            echo "::error::reference to a subsystem this repository does not include"
            exit 1
          fi
      - name: No credentials committed
        # Matches credential FILES, not the scripts that mint them:
        # make-scoped-kubeconfig.sh is exactly the thing you are supposed to run.
        run: |
          if git ls-files | grep -InE '(^|/)\.env$|\.kubeconfig$|\.pem$|(^|/)(id_rsa|id_ed25519)$'; then
            echo "::error::a credential file is tracked"
            exit 1
          fi

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/llm-autotune --set jwtSecret=ci --set adminPassword=ci
      - name: The chart renders, in both shapes
        run: |
          helm template t deploy/helm/llm-autotune \
            --set jwtSecret=ci --set adminPassword=ci --set gpuCluster.inCluster=true > /dev/null
          helm template t deploy/helm/llm-autotune \
            -f deploy/helm/llm-autotune/values-mock.yaml \
            --set jwtSecret=ci --set adminPassword=ci > /dev/null
