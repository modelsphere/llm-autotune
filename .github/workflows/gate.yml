name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: LICENSE is the Apache-2.0 text, unmodified
        run: |
          if ! grep -q "Apache License" LICENSE || ! grep -q "Version 2.0, January 2004" LICENSE; then
            echo "::error file=LICENSE::LICENSE is not the Apache-2.0 text."
            exit 1
          fi

  repository:
    # Checked out without submodules on purpose: llm-autotune-policies checks
    # its own tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No credentials committed
        # Matches credential FILES, not the scripts that mint them:
        # deploy/gpu-cluster.sh is exactly the thing you are supposed to run.
        run: |
          if git ls-files | grep -InE '(^|/)\.env$|\.kubeconfig$|\.pem$|(^|/)(id_rsa|id_ed25519)$'; then
            echo "::error::a credential file is tracked"
            exit 1
          fi

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: helm lint deploy/helm/llm-autotune --set jwtSecret=ci --set adminPassword=ci
      - name: The chart renders, in every shape
        run: |
          helm template t deploy/helm/llm-autotune \
            --set jwtSecret=ci --set adminPassword=ci --set gpuCluster.inCluster=true > /dev/null
          helm template t deploy/helm/llm-autotune \
            --set jwtSecret=ci --set adminPassword=ci \
            --set frontend.service.type=NodePort --set frontend.service.nodePort=30080 > /dev/null
          helm template t deploy/helm/llm-autotune \
            -f deploy/helm/llm-autotune/values-demo.yaml \
            --set jwtSecret=ci --set adminPassword=ci > /dev/null
          helm template t deploy/helm/llm-autotune \
            -f deploy/helm/llm-autotune/values-demo.yaml \
            -f deploy/helm/llm-autotune/values-mock.yaml \
            --set jwtSecret=ci --set adminPassword=ci > /dev/null
      - name: The install scripts pass shellcheck
        run: shellcheck -x deploy/quickstart.sh deploy/demo.sh deploy/lib/platforms.sh deploy/gpu-cluster.sh deploy/dev/mock-gpu-cluster.sh
