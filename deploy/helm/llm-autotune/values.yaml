# LLM AutoTune — one release brings up the API, the worker, the UI and their
# datastores. Everything below has a working default except `jwtSecret`, which
# you must set, and `adminPassword`, without which no account is created.
#
#   helm install autotune deploy/helm/llm-autotune \
#     --set jwtSecret=$(openssl rand -hex 32) --set adminPassword=...
#
# For a GPU-free trial on kind, add `-f values-mock.yaml`.

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io/modelsphere
  backend: llm-autotune-backend
  frontend: llm-autotune-frontend
  tag: ""                      # empty = the chart's appVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

# REQUIRED. Sign-in tokens are minted with this, and it also encrypts the
# kubeconfigs you paste in for GPU clusters — rotating it logs everyone out and
# makes stored kubeconfigs unreadable.
jwtSecret: ""

# The first admin, created only when the users table is empty. Leave the
# password empty and no account is made; you then create one another way.
adminUsername: admin
adminPassword: ""

# Both are used to build links handed to other systems, so they must be
# addresses those systems can reach, not cluster-internal names.
#   publicApiUrl — how a POLICY CONTAINER on a GPU machine calls home.
#                  Required for policy campaigns.
#   publicUiUrl  — how a PERSON's browser reaches the UI.
publicApiUrl: ""
publicUiUrl: ""

# Browser origins allowed to call the API. "*" is right when the UI is served
# from this same ingress, which is the default.
corsOrigins: "*"

api:
  replicas: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # An ssh identity the worker uses to reach bare-metal GPU boxes (the
  # `ssh_docker` driver). Leave disabled for a k8s-only fleet.
  ssh:
    enabled: false
    # Name of an existing Secret holding the private key (and optionally
    # known_hosts). Create it yourself — a key does not belong in values.yaml:
    #   kubectl create secret generic autotune-worker-ssh \
    #     --from-file=id_ed25519=$HOME/.ssh/id_ed25519
    existingSecret: ""

frontend:
  replicas: 1
  resources: {}

# Engine logs: the worker writes them, the API serves them. Two pods, one
# volume, so it wants ReadWriteMany. Without an RWX class, set enabled=false —
# everything works except reading a run's engine log from the UI.
runLogs:
  enabled: true
  size: 5Gi
  storageClass: ""

postgresql:
  enabled: true                # false = bring your own, via externalDatabase
  image: postgres:16-alpine
  user: autotune
  database: autotune
  password: autotune           # change it, or use existingSecret below
  existingSecret: ""           # a Secret with key POSTGRES_PASSWORD
  storage:
    size: 20Gi
    storageClass: ""
  resources: {}

externalDatabase:
  # Used when postgresql.enabled=false. Both DSNs, because the API is async and
  # the worker and migrations are not.
  asyncUrl: ""                 # postgresql+asyncpg://user:pass@host:5432/db
  syncUrl: ""                  # postgresql+psycopg2://user:pass@host:5432/db

redis:
  enabled: true
  image: redis:7-alpine
  externalUrl: ""              # used when enabled=false

# The benchmark platform every run is measured by. Point this at your LLMBench
# deployment. `mock.enabled` (values-mock.yaml) replaces it with a fake for a
# GPU-free trial.
llmbench:
  url: ""
  apiKey: ""
  username: ""
  password: ""
  benchmarkSlug: perf-suite-v1

# The GPU cluster runs land on.
gpuCluster:
  # true = the cluster this release is installed into. The chart then grants
  # its ServiceAccount the RBAC the launch driver needs and the platform talks
  # to the local API server. false = register clusters from the Resources page
  # by pasting a scoped kubeconfig (see deploy/k8s/remote-cluster/).
  inCluster: false
  # Where engine pods go. Empty = this release's namespace.
  namespace: ""
  # "deployment" = a Deployment + NodePort Service, which works on any cluster.
  # "custom" = a TuningRun for the autotune operator to reconcile.
  workloadKind: deployment
  gpuResource: nvidia.com/gpu
  runtimeClass: nvidia
  # GPU nodes are commonly tainted so that pods with no use for cards keep off
  # them; a run's pod tolerates that taint by default.
  tolerateGpuTaint: true
  nodeSelector: ""             # comma-separated label=value pairs
  # Model weights. Empty = a per-node hostPath at the campaign's model path.
  modelPvc: ""
  modelPvcRoot: ""
  shmSizeMb: 2048
  # On an empty install, register this cluster as a machine pool automatically
  # so the first campaign has somewhere to run.
  autoRegister: true

# The k8s operator (optional). With it, a run is a TuningRun the operator
# reconciles instead of a Deployment the platform manages directly.
operator:
  enabled: false

ingress:
  enabled: false
  className: ""
  host: autotune.example.com
  annotations: {}
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

# A fake engine and a fake benchmark platform, for proving the loop with no
# GPUs. See values-mock.yaml.
mock:
  enabled: false
  image: ghcr.io/modelsphere/llm-autotune-mock-engine
