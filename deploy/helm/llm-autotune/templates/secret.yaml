{{- $fullName := include "llm-autotune.fullname" . -}}
{{- $pg := .Values.postgresql -}}
{{- /* Each secret is the value given, else the one this release already holds,
       else generated: an install needs nothing typed in, and an upgrade keeps
       what the database and the stored kubeconfigs were made with. `helm
       template` sees no live Secret and renders fresh ones it never applies. */ -}}
{{- $live := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" $fullName)).data | default dict -}}
{{- $jwt := .Values.jwtSecret | default (index $live "AUTOTUNE_JWT_SECRET" | default "" | b64dec) | default (randAlphaNum 64) -}}
{{- $admin := .Values.adminPassword | default (index $live "AUTOTUNE_ADMIN_PASSWORD" | default "" | b64dec) | default (randAlphaNum 20) -}}
{{- $pgPass := $pg.password | default (index $live "POSTGRES_PASSWORD" | default "" | b64dec) | default (randAlphaNum 32) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-secrets
  labels: {{- include "llm-autotune.labels" . | nindent 4 }}
  # Kept on uninstall, like the database volume it pairs with: a reinstall
  # that generated a new postgres password or jwtSecret could no longer open
  # the database or the kubeconfigs stored in it. To start over, delete the
  # Secret together with the volume.
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  AUTOTUNE_JWT_SECRET: {{ $jwt | quote }}
  AUTOTUNE_ADMIN_PASSWORD: {{ $admin | quote }}
  {{- if not .Values.llmbench.apiKeySecret.name }}
  AUTOTUNE_LLMBENCH_API_KEY: {{ .Values.llmbench.apiKey | quote }}
  {{- end }}
  AUTOTUNE_LLMBENCH_PASSWORD: {{ .Values.llmbench.password | quote }}
  {{- if $pg.enabled }}
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  AUTOTUNE_DATABASE_URL: postgresql+asyncpg://{{ $pg.user }}:{{ $pgPass }}@{{ $fullName }}-postgresql:5432/{{ $pg.database }}
  AUTOTUNE_SYNC_DATABASE_URL: postgresql+psycopg2://{{ $pg.user }}:{{ $pgPass }}@{{ $fullName }}-postgresql:5432/{{ $pg.database }}
  {{- else }}
  AUTOTUNE_DATABASE_URL: {{ required "externalDatabase.asyncUrl is required when postgresql.enabled=false" .Values.externalDatabase.asyncUrl | quote }}
  AUTOTUNE_SYNC_DATABASE_URL: {{ required "externalDatabase.syncUrl is required when postgresql.enabled=false" .Values.externalDatabase.syncUrl | quote }}
  {{- end }}
