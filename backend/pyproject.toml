[project]
name = "llm-autotune-backend"
version = "0.1.1"
description = "LLM Autotune platform — API server and orchestrator worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    # Fernet, for the credentials users entrust to us (a cluster's kubeconfig).
    # Reversible by necessity — it has to be replayed to the cluster on every
    # call — so it is encrypted at rest rather than hashed like a password.
    "cryptography>=42",
    "kubernetes>=36.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    # Lets the API tests drive real HTTP through the ASGI app against an
    # in-memory database, which is the only way to cover request parsing —
    # where a schema default silently overwrote a machine's card count.
    "aiosqlite>=0.20",
    # SQLAlchemy's async layer needs it; asyncpg pulls it in on the deployed
    # box but the sqlite driver does not, so tests would fail where production
    # works.
    "greenlet>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` in parameter defaults is idiomatic.
ignore = ["B008"]
