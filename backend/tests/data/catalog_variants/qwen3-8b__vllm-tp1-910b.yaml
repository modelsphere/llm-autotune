apiVersion: catalog.swiss/v2
kind: Variant
model: qwen3-8b
id: vllm-tp1-910b
version: 1.0.0
servedName: Qwen3-8B
engine: vllm
chart:
  name: vllm
  version: '>=0.7.6'
image:
  repository: quay.io/ascend/vllm-ascend
  tag: v0.23.0.post1
  digest: sha256:ffe9306186781ddb80812eda574134e601ee8499693ea36e4a97173111ddf7e7
requires:
  gpus: 1
  topology: single-node
  vendor: ascend
  gpuProduct:
  - Ascend-910B3
values:
  model:
    hostPathType: Directory
    contextLength: ''
  modelCheck:
    enabled: true
    requiredGlobs:
    - config.json
    - '*.safetensors'
  extraArgs:
  - --enable-prompt-tokens-details
  - --gpu-memory-utilization=0.9
  env:
  - name: VLLM_USE_V1
    value: '1'
  volumes:
  - name: dot-cache
    emptyDir:
      sizeLimit: 10Gi
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 16Gi
  volumeMounts:
  - name: dot-cache
    mountPath: /root/.cache
  - name: dshm
    mountPath: /dev/shm
  resources:
    requests:
      ephemeral-storage: 16Gi
    limits:
      ephemeral-storage: 16Gi
  progressDeadlineSeconds: 7200
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  terminationGracePeriodSeconds: 1200
  lifecycle:
    preStop:
      enabled: true
      drainSeconds: 600
      endpointSyncSeconds: 10
      pollIntervalSeconds: 5
    shutdownTimeout: 120
    preStopKill: true
  hangWatcher:
    enabled: true
