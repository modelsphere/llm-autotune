apiVersion: catalog.swiss/v2
kind: Variant
model: kimi-k3
id: sglang-tp8-b300-optimized
version: 1.0.5
servedName: kimi-k3
engine: sglang
chart:
  name: sglang
  version: '>=0.7.9'
image:
  repository: lmsysorg/sglang
  tag: v0.5.19
  digest: sha256:d6e7288627be8b02be88e4bba38e73f6d50e2826869f753c13a4c4385ab3eda9
requires:
  gpus: 8
  topology: single-node
  gpuProduct:
  - NVIDIA-B300-SXM6-AC
values:
  model:
    mountPath: /model
    hostPathType: Directory
    contextLength: ''
  modelCheck:
    enabled: true
    requiredGlobs:
    - config.json
    - '*.safetensors'
  extraArgs:
  - --chunked-prefill-size=16384
  - --dcp-size=8
  - --enable-cache-report
  - --enable-hierarchical-cache
  - --enable-linear-replayssm-spec
  - --hicache-size=150
  - --kv-cache-dtype=fp8_e4m3
  - --mamba-full-memory-ratio=2
  - --max-running-requests=51
  - --mem-fraction-static=0.85
  - --reasoning-parser=kimi_k3
  - --speculative-algorithm=DSPARK
  - --speculative-draft-model-path=/draft-model
  - --speculative-dspark-block-size=4
  - --stream-response-default-include-usage
  - --tokenizer-worker-num=4
  - --tool-call-parser=kimi_k3
  - --tp-size=8
  - --trust-remote-code
  env:
  - name: NVIDIA_DISABLE_REQUIRE
    value: '1'
  - name: PYTORCH_ALLOC_CONF
    value: expandable_segments:True
  - name: TORCHINDUCTOR_COMPILE_THREADS
    value: '8'
  volumes:
  - name: draft-model
    hostPath:
      path: /mnt/disk0/models/Kimi-K3-DSpark
      type: Directory
  - name: dot-cache
    emptyDir:
      sizeLimit: 10Gi
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 32Gi
  volumeMounts:
  - name: draft-model
    mountPath: /draft-model
    readOnly: true
  - name: dot-cache
    mountPath: /root/.cache
  - name: dshm
    mountPath: /dev/shm
  resources:
    requests:
      ephemeral-storage: 16Gi
    limits:
      ephemeral-storage: 16Gi
  progressDeadlineSeconds: 9300
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 250
  terminationGracePeriodSeconds: 3600
  lifecycle:
    preStop:
      drainSeconds: 600
      pollIntervalSeconds: 5
    forceShutdown: true
    preStopKill: true
  hangWatcher:
    enabled: true
