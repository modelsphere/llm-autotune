apiVersion: catalog.swiss/v2
kind: Variant
model: kimi-k3
id: sglang-tp8-b300-baseline
version: 1.0.5
servedName: kimi-k3
engine: sglang
chart:
  name: sglang
  version: '>=0.7.9'
image:
  repository: lmsysorg/sglang
  tag: v0.5.19
requires:
  gpus: 8
  topology: single-node
  gpuProduct:
  - NVIDIA-B300-SXM6-AC
values:
  model:
    mountPath: /model
    hostPathType: Directory
    contextLength: ''
  modelCheck:
    enabled: true
    requiredGlobs:
    - config.json
    - '*.safetensors'
  extraArgs:
  - --enable-cache-report
  - --reasoning-parser=kimi_k3
  - --stream-response-default-include-usage
  - --tool-call-parser=kimi_k3
  - --tp-size=8
  - --trust-remote-code
  env:
  - name: NVIDIA_DISABLE_REQUIRE
    value: '1'
  - name: PYTORCH_ALLOC_CONF
    value: expandable_segments:True
  volumes:
  - name: dot-cache
    emptyDir:
      sizeLimit: 10Gi
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 32Gi
  volumeMounts:
  - name: dot-cache
    mountPath: /root/.cache
  - name: dshm
    mountPath: /dev/shm
  resources:
    requests:
      ephemeral-storage: 16Gi
    limits:
      ephemeral-storage: 16Gi
  progressDeadlineSeconds: 11100
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 310
  terminationGracePeriodSeconds: 3600
  lifecycle:
    preStop:
      drainSeconds: 600
      pollIntervalSeconds: 5
    forceShutdown: true
    preStopKill: true
  hangWatcher:
    enabled: true
