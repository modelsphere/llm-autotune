apiVersion: catalog.swiss/v2
kind: Variant
model: google-gemma-4-31b-it
id: sglang-tp4-h100-optimized
version: 1.0.0
servedName: google/gemma-4-31B-it
engine: sglang
chart:
  name: sglang
  version: '>=0.7.1'
image:
  repository: lmsysorg/sglang
  tag: v0.5.19-cu129
  digest: sha256:59e11312666e1c5c155210ea335589b91daa0d70848521b390b93b1b1e8fb0ef
requires:
  gpus: 4
  topology: single-node
  gpuProduct:
  - NVIDIA-H100-80GB-HBM3
values:
  model:
    hostPathType: Directory
    contextLength: ''
  modelCheck:
    enabled: true
    requiredGlobs:
    - config.json
    - '*.safetensors'
  extraArgs:
  - --chunked-prefill-size=16384
  - --enable-cache-report
  - --max-prefill-tokens=16384
  - --mem-fraction-static=0.85
  - --reasoning-parser=gemma4
  - --stream-response-default-include-usage
  - --tool-call-parser=gemma4
  - --tp-size=4
  - --triton-attention-num-kv-splits=16
  env:
  - name: NVIDIA_DISABLE_REQUIRE
    value: '1'
  - name: PYTORCH_ALLOC_CONF
    value: expandable_segments:True
  volumes:
  - name: dot-cache
    emptyDir:
      sizeLimit: 10Gi
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 32Gi
  volumeMounts:
  - name: dot-cache
    mountPath: /root/.cache
  - name: dshm
    mountPath: /dev/shm
  resources:
    requests:
      ephemeral-storage: 16Gi
    limits:
      ephemeral-storage: 16Gi
  progressDeadlineSeconds: 7200
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  terminationGracePeriodSeconds: 3600
  lifecycle:
    preStop:
      drainSeconds: 600
      pollIntervalSeconds: 5
    forceShutdown: true
    preStopKill: true
  hangWatcher:
    enabled: true
