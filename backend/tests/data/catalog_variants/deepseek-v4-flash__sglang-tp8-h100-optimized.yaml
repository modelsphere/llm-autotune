apiVersion: catalog.swiss/v2
kind: Variant
model: deepseek-v4-flash
id: sglang-tp8-h100-optimized
version: 1.0.2
servedName: deepseek-v4-flash
engine: sglang
chart:
  name: sglang
  version: '>=0.7.1'
image:
  repository: lmsysorg/sglang
  tag: dev-dsv41
requires:
  gpus: 8
  topology: single-node
  gpuProduct:
  - NVIDIA-H100-80GB-HBM3
values:
  model:
    hostPathType: Directory
    contextLength: ''
  modelCheck:
    enabled: true
    requiredGlobs:
    - config.json
    - '*.safetensors'
  extraArgs:
  - --enable-cache-report
  - --moe-runner-backend=marlin
  - --speculative-algorithm=EAGLE
  - --speculative-eagle-topk=1
  - --speculative-num-draft-tokens=4
  - --speculative-num-steps=3
  - --stream-response-default-include-usage
  - --tp-size=8
  - --trust-remote-code
  env:
  - name: PYTORCH_ALLOC_CONF
    value: expandable_segments:True
  - name: NVIDIA_DISABLE_REQUIRE
    value: '1'
  volumes:
  - name: dot-cache
    emptyDir:
      sizeLimit: 10Gi
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 32Gi
  volumeMounts:
  - name: dot-cache
    mountPath: /root/.cache
  - name: dshm
    mountPath: /dev/shm
  resources:
    requests:
      ephemeral-storage: 16Gi
    limits:
      ephemeral-storage: 16Gi
  progressDeadlineSeconds: 7200
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  terminationGracePeriodSeconds: 3600
  lifecycle:
    preStop:
      drainSeconds: 600
      pollIntervalSeconds: 5
    forceShutdown: true
    preStopKill: true
  hangWatcher:
    enabled: true
