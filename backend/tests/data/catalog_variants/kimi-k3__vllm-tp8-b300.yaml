apiVersion: catalog.swiss/v2
kind: Variant
model: kimi-k3
id: vllm-tp8-b300
version: 1.0.5
servedName: kimi-k3
engine: vllm
image:
  repository: 4pdosc/vllm-openai
  tag: v0.30.1-nightly-0961bbae-patch
chart:
  name: vllm
  version: '>=0.4.6'
requires:
  gpus: 8
  topology: single-node
  gpuProduct:
  - NVIDIA-B300-SXM6-AC
values:
  env:
  - name: NVIDIA_DISABLE_REQUIRE
    value: '1'
  - name: LD_LIBRARY_PATH
    value: /usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
  - name: MOONCAKE_CONFIG_PATH
    value: /root/mc-config/mooncake_vllm_config.json
  - name: MOONCAKE_MASTER
    value: etcd://172.26.3.13:2379;172.26.3.14:2379
  - name: MOONCAKE_TE_META_DATA_SERVER
    value: P2PHANDSHAKE
  - name: MOONCAKE_PROTOCOL
    value: rdma
  - name: MOONCAKE_DEVICE
    value: mlx5_10
  - name: MC_MS_FILTERS
    value: mlx5_10
  - name: MOONCAKE_GLOBAL_SEGMENT_SIZE
    value: '0'
  - name: TORCHINDUCTOR_COMPILE_THREADS
    value: '8'
  - name: PYTHONHASHSEED
    value: '0'
  - name: VLLM_ALLREDUCE_USE_FLASHINFER
    value: '1'
  - name: VLLM_ENGINE_READY_TIMEOUT_S
    value: '3600'
  - name: VLLM_USE_V2_MODEL_RUNNER
    value: '1'
  - name: VLLM_USE_RUST_FRONTEND
    value: '0'
  extraArgs:
  - --trust-remote-code
  - --gpu-memory-utilization=0.9
  - --tensor-parallel-size=8
  - --load-format=fastsafetensors
  - --no-enable-flashinfer-autotune
  - --kv-cache-dtype=fp8
  - --enable-prefix-caching
  - --enable-prompt-tokens-details
  - --prefix-match-unit=128
  - --max-num-seqs=48
  - --enable-auto-tool-choice
  - --tool-call-parser=kimi_k3
  - --reasoning-parser=kimi_k3
  - --allowed-media-domains=no-network.invalid
  - --decode-context-parallel-size=8
  - --dcp-comm-backend=a2a
  - --attention-backend=TOKENSPEED_MLA
  - --attention-config={"use_prefill_query_quantization":true,"mla_prefill_backend":"TRTLLM_RAGGED"}
  - '--speculative-config={"model":"/draft-model", "num_speculative_tokens":4, "attention_backend":"FLASHINFER_MLA", "method": "dspark", "draft_sample_method": "probabilistic", "rejection_sample_method": "block"}'
  - "--kv-transfer-config={\n\"kv_connector\": \"MultiConnector\",\n\"kv_role\": \"kv_both\",\n\"kv_connector_extra_config\": {\n  \"connectors\": [\n    {\n      \"kv_connector\": \"SimpleCPUOffloadConnector\",\n      \"kv_role\": \"kv_both\",\n      \"kv_connector_extra_config\": {\n        \"cpu_bytes_to_use\": 1319413953331,\n        \"lazy_offload\": false\n      }\n    },\n    {\n      \"kv_connector\": \"MooncakeStoreConnector\",\n      \"kv_role\": \"kv_both\"\n    }\n  ]\n}}\n"
  hangWatcher:
    config:
      activeProbeTimeoutSec: 120
      stallSec: 900
    livenessProbe:
      failureThreshold: 3
      periodSeconds: 30
  lifecycle:
    preStop:
      drainSeconds: 900
      enabled: true
      endpointSyncSeconds: 10
      pollIntervalSeconds: 5
    shutdownTimeout: 120
  model:
    maxLen: '1048576'
    mountPath: /model
  progressDeadlineSeconds: 5400
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    timeoutSeconds: 5
  resources:
    limits:
      ephemeral-storage: 64Gi
      rdma/hca_shared: '1'
    requests:
      cpu: '16'
      ephemeral-storage: 64Gi
  schedulerName: volcano
  securityContext:
    capabilities:
      add:
      - SYS_PTRACE
      - SYS_NICE
      - IPC_LOCK
  service:
    port: 8050
  startupProbe:
    failureThreshold: 280
    httpGet:
      path: /health
      port: http
    periodSeconds: 15
    timeoutSeconds: 10
  terminationGracePeriodSeconds: 1200
  volumeMounts:
  - mountPath: /dev/shm
    name: shm
  - mountPath: /draft-model
    name: draft-model
    readOnly: true
  - mountPath: /root/.cache
    name: compile-cache
  - mountPath: /root/mc-config
    name: mooncake-config
    readOnly: true
  volumes:
  - emptyDir:
      medium: Memory
      sizeLimit: 32Gi
    name: shm
  - hostPath:
      path: /mnt/disk0/models/Kimi-K3-DSpark-vllm
      type: Directory
    name: draft-model
  - emptyDir:
      sizeLimit: 32Gi
    name: compile-cache
  - hostPath:
      path: /mnt/disk0/models/config/mc-config
      type: Directory
    name: mooncake-config
