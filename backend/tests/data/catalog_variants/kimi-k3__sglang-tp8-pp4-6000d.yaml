apiVersion: catalog.swiss/v2
kind: Variant
model: kimi-k3
id: sglang-tp8-pp4-6000d
version: 1.0.5
servedName: kimi-k3
engine: sglang
chart:
  name: sglang
  version: '>=0.7.0'
image:
  repository: lmsysorg/sglang
  tag: v0.5.20
requires:
  gpus: 8
  nodes: 4
  topology: lws
  rdma: true
  gpuProduct:
  - NVIDIA-RTX-6000D
values:
  model:
    localPath: /data/models/Kimi-K3
    mountPath: /model
    contextLength: ''
  modelCheck:
    enabled: true
    requiredGlobs:
    - config.json
    - '*.safetensors'
  lws:
    enabled: true
    size: 4
  hostNetwork: true
  rdma:
    enabled: true
  env:
  - name: NVIDIA_DISABLE_REQUIRE
    value: '1'
  - name: PYTORCH_ALLOC_CONF
    value: expandable_segments:True
  - name: NCCL_DEBUG
    value: WARN
  - name: NCCL_IB_DISABLE
    value: '0'
  - name: NCCL_NET_GDR_LEVEL
    value: '1'
  - name: NCCL_SOCKET_IFNAME
    value: bond0
  - name: GLOO_SOCKET_IFNAME
    value: bond0
  extraArgs:
  - --tp-size=8
  - --pp-size=4
  - --moe-runner-backend=marlin
  - --mem-fraction-static=0.85
  - --trust-remote-code
  - --enable-metrics
  - --enable-cache-report
  - --reasoning-parser=kimi_k3
  - --tool-call-parser=kimi_k3
  service:
    port: 8050
  progressDeadlineSeconds: 7200
  hangWatcher:
    enabled: true
