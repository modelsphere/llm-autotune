apiVersion: catalog.swiss/v2
kind: Variant
model: deepseek-v4-pro
id: vllm-tp8-pp2-6000d
version: 1.0.1
servedName: deepseek-v4-pro
engine: vllm
chart:
  name: vllm
  version: '>=0.7.6'
image:
  repository: vllm/vllm-openai
  tag: v0.30.0
requires:
  gpus: 8
  nodes: 2
  topology: lws
  rdma: true
  gpuProduct:
  - NVIDIA-RTX-6000D
values:
  model:
    localPath: /data/models/DeepSeek-V4-Pro
    mountPath: /models
    contextLength: '1048576'
  modelCheck:
    enabled: true
    requiredGlobs:
    - config.json
    - '*.safetensors'
  lws:
    enabled: true
    size: 2
  hostNetwork: true
  rdma:
    enabled: true
  extraArgs:
  - --tensor-parallel-size=8
  - --pipeline-parallel-size=2
  - --gpu-memory-utilization=0.90
  - --block-size=256
  - --max-num-batched-tokens=8192
  - --max-num-seqs=48
  - --enable-prefix-caching
  - --trust-remote-code
  - --enable-prompt-tokens-details
  - --allowed-media-domains=none.invalid
  - --enable-auto-tool-choice
  - --tool-call-parser=deepseek_v4
  - --reasoning-parser=deepseek_v4
  env:
  - name: PYTORCH_ALLOC_CONF
    value: expandable_segments:True
  - name: VLLM_FLASHINFER_AUTOTUNE_SKIP_OPS
    value: trtllm::fused_moe::gemm1,trtllm::fused_moe::gemm2,fp8_gemm
  - name: VLLM_MEDIA_URL_ALLOW_REDIRECTS
    value: '0'
  - name: NCCL_DEBUG
    value: INFO
  - name: NCCL_SOCKET_IFNAME
    value: bond0
  - name: GLOO_SOCKET_IFNAME
    value: bond0
  - name: NCCL_NET_GDR_LEVEL
    value: '1'
  service:
    port: 8050
  hangWatcher:
    enabled: true
