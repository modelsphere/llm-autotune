apiVersion: catalog.swiss/v2
kind: Variant
model: glm5.3
id: sglang-tp4-b300-optimized
version: 1.0.4
servedName: glm-5.3
engine: sglang
chart:
  name: sglang
  version: '>=0.7.8'
image:
  repository: lmsysorg/sglang
  tag: v0.5.19
  digest: sha256:d6e7288627be8b02be88e4bba38e73f6d50e2826869f753c13a4c4385ab3eda9
requires:
  gpus: 4
  topology: single-node
  gpuProduct:
  - NVIDIA-B300-SXM6-AC
values:
  model:
    mountPath: /model
    hostPathType: Directory
    contextLength: ''
  modelCheck:
    enabled: true
    requiredGlobs:
    - config.json
    - '*.safetensors'
  extraArgs:
  - --chunked-prefill-size=16384
  - --cuda-graph-max-bs-decode=32
  - --enable-cache-report
  - --enable-hierarchical-cache
  - --hicache-size=150
  - --max-prefill-tokens=16384
  - --max-running-requests=32
  - --mem-fraction-static=0.85
  - --quantization=modelopt_fp4
  - --reasoning-parser=glm45
  - --speculative-algorithm=EAGLE
  - --speculative-eagle-topk=1
  - --speculative-num-draft-tokens=4
  - --speculative-num-steps=3
  - --stream-response-default-include-usage
  - --tokenizer-worker-num=4
  - --tool-call-parser=glm47
  - --tp-size=4
  - --trust-remote-code
  env:
  - name: NVIDIA_DISABLE_REQUIRE
    value: '1'
  - name: PYTORCH_ALLOC_CONF
    value: expandable_segments:True
  - name: TORCHINDUCTOR_COMPILE_THREADS
    value: '8'
  volumes:
  - name: dot-cache
    emptyDir:
      sizeLimit: 10Gi
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 32Gi
  volumeMounts:
  - name: dot-cache
    mountPath: /root/.cache
  - name: dshm
    mountPath: /dev/shm
  resources:
    requests:
      ephemeral-storage: 16Gi
    limits:
      ephemeral-storage: 16Gi
  progressDeadlineSeconds: 7200
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  terminationGracePeriodSeconds: 3600
  lifecycle:
    preStop:
      drainSeconds: 600
      pollIntervalSeconds: 5
    forceShutdown: true
    preStopKill: true
  hangWatcher:
    enabled: true
