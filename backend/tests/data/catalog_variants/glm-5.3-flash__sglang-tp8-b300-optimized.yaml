apiVersion: catalog.swiss/v2
kind: Variant
model: glm-5.3-flash
id: sglang-tp8-b300-optimized
version: 1.0.1
servedName: GLM-5.3-Flash
engine: sglang
chart:
  name: sglang
  version: '>=0.7.1'
image:
  repository: 4pdosc/sglang
  tag: glm-5.3-flash
  digest: sha256:127b3812d892ee1a4cce74475e1e6b645e74de5c67204b34615bc6279c84a539
requires:
  gpus: 8
  topology: single-node
  gpuProduct:
  - NVIDIA-B300-SXM6-AC
values:
  model:
    mountPath: /model
    hostPathType: Directory
    contextLength: ''
  modelCheck:
    enabled: true
    requiredGlobs:
    - config.json
    - '*.safetensors'
  extraArgs:
  - --chat-template=/model/chat_template.jinja
  - --dsa-decode-backend=trtllm
  - --dsa-prefill-backend=trtllm
  - --enable-cache-report
  - --ep-size=8
  - --kv-cache-dtype=fp8_e4m3
  - --moe-runner-backend=deep_gemm
  - --reasoning-parser=glm45
  - --stream-response-default-include-usage
  - --tool-call-parser=glm47
  - --tp-size=8
  - --trust-remote-code
  env:
  - name: NVIDIA_DISABLE_REQUIRE
    value: '1'
  - name: PYTORCH_ALLOC_CONF
    value: expandable_segments:True
  volumes:
  - name: dot-cache
    emptyDir:
      sizeLimit: 10Gi
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 32Gi
  volumeMounts:
  - name: dot-cache
    mountPath: /root/.cache
  - name: dshm
    mountPath: /dev/shm
  resources:
    requests:
      ephemeral-storage: 16Gi
    limits:
      ephemeral-storage: 16Gi
  progressDeadlineSeconds: 7200
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  terminationGracePeriodSeconds: 3600
  lifecycle:
    preStop:
      drainSeconds: 600
      pollIntervalSeconds: 5
    forceShutdown: true
    preStopKill: true
  hangWatcher:
    enabled: true
