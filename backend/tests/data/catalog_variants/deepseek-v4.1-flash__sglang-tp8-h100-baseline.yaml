apiVersion: catalog.swiss/v2
kind: Variant
model: deepseek-v4.1-flash
id: sglang-tp8-h100-baseline
version: 1.0.0
servedName: DeepSeek-V4.1-Flash
engine: sglang
chart:
  name: sglang
  version: '>=0.7.1'
image:
  repository: lmsysorg/sglang
  tag: dev-dsv41
requires:
  gpus: 8
  topology: single-node
  gpuProduct:
  - NVIDIA-H100-80GB-HBM3
values:
  model:
    hostPathType: Directory
    contextLength: ''
  modelCheck:
    enabled: true
    requiredGlobs:
    - config.json
    - '*.safetensors'
  extraArgs:
  - --attention-backend=dsv4
  - --chunked-prefill-size=4096
  - --cuda-graph-max-bs-decode=16
  - --enable-cache-report
  - --enable-decoder-swa-bounded-replay
  - --ep-size=8
  - --max-running-requests=16
  - --mem-fraction-static=0.83
  - --moe-runner-backend=flashinfer_mxfp4
  - --reasoning-parser=auto
  - --stream-response-default-include-usage
  - --tool-call-parser=auto
  - --tp-size=8
  - --trust-remote-code
  env:
  - name: PYTORCH_ALLOC_CONF
    value: expandable_segments:True
  - name: NVIDIA_DISABLE_REQUIRE
    value: '1'
  volumes:
  - name: dot-cache
    emptyDir:
      sizeLimit: 10Gi
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 32Gi
  volumeMounts:
  - name: dot-cache
    mountPath: /root/.cache
  - name: dshm
    mountPath: /dev/shm
  resources:
    requests:
      ephemeral-storage: 16Gi
    limits:
      ephemeral-storage: 16Gi
  progressDeadlineSeconds: 7200
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 180
  terminationGracePeriodSeconds: 3600
  lifecycle:
    preStop:
      drainSeconds: 600
      pollIntervalSeconds: 5
    forceShutdown: true
    preStopKill: true
  hangWatcher:
    enabled: true
