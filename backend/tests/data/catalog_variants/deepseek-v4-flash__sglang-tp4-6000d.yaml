apiVersion: catalog.swiss/v2
kind: Variant
model: deepseek-v4-flash
id: sglang-tp4-6000d
version: 1.0.2
servedName: deepseek-v4-flash
engine: sglang
chart:
  name: sglang
  version: '>=0.7.0'
image:
  repository: lmsysorg/sglang
  tag: v0.5.20
requires:
  gpus: 4
  topology: single-node
  gpuProduct:
  - NVIDIA-RTX-6000D
values:
  model:
    localPath: /data/models/DeepSeek-V4-Flash
    mountPath: /model
    contextLength: ''
  modelCheck:
    enabled: true
    requiredGlobs:
    - config.json
    - '*.safetensors'
  extraArgs:
  - --tp-size=4
  - --mem-fraction-static=0.85
  - --trust-remote-code
  - --enable-metrics
  - --enable-cache-report
  - --reasoning-parser=deepseek-v4
  - --tool-call-parser=deepseekv4
  env:
  - name: NVIDIA_DISABLE_REQUIRE
    value: '1'
  - name: PYTORCH_ALLOC_CONF
    value: expandable_segments:True
  service:
    port: 8050
  hangWatcher:
    enabled: true
