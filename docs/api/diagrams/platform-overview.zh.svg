<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 190" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7a"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6f4f"/>
    </marker>
  </defs>

  <rect width="1040" height="190" fill="#ffffff"/>

  <!-- campaign -->
  <rect x="20" y="62" width="160" height="84" rx="8" fill="#eef1f5" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="100" y="92" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Campaign</text>
  <text x="100" y="113" font-size="12.5" fill="#4a5a6a" text-anchor="middle">model、search space、</text>
  <text x="100" y="131" font-size="12.5" fill="#4a5a6a" text-anchor="middle">objective + redline</text>

  <!-- search loop -->
  <rect x="220" y="20" width="420" height="150" rx="10" fill="#f5f8fc" stroke="#b8c4d0" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="238" y="42" font-size="12" font-weight="700" fill="#4a5a6a" letter-spacing="0.6">在 GPU 上 SEARCH，直到截止</text>

  <rect x="238" y="62" width="150" height="84" rx="8" fill="#d9f0e2" stroke="#2f6f4f" stroke-width="2.4"/>
  <text x="313" y="92" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Policy</text>
  <text x="313" y="113" font-size="12.5" fill="#2f4f3f" text-anchor="middle">你的 search</text>
  <text x="313" y="131" font-size="12.5" fill="#2f4f3f" text-anchor="middle">算法</text>

  <rect x="472" y="62" width="150" height="84" rx="8" fill="#e4edf9" stroke="#5b85c9" stroke-width="1.4"/>
  <text x="547" y="92" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">平台</text>
  <text x="547" y="113" font-size="12.5" fill="#4a5a6a" text-anchor="middle">启动 engine，</text>
  <text x="547" y="131" font-size="12.5" fill="#4a5a6a" text-anchor="middle">LLMBench 测量</text>

  <line x1="388" y1="86" x2="470" y2="86" stroke="#2f6f4f" stroke-width="1.8" marker-end="url(#arrg)"/>
  <text x="430" y="76" font-size="12" fill="#2f6f4f" text-anchor="middle">配置</text>
  <line x1="472" y1="122" x2="390" y2="122" stroke="#5b6b7a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="430" y="140" font-size="12" fill="#5b6b7a" text-anchor="middle">结果</text>

  <!-- validation -->
  <rect x="690" y="62" width="150" height="84" rx="8" fill="#e4edf9" stroke="#5b85c9" stroke-width="1.4"/>
  <text x="765" y="92" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">验证</text>
  <text x="765" y="113" font-size="12.5" fill="#4a5a6a" text-anchor="middle">平台重新测量</text>
  <text x="765" y="131" font-size="12.5" fill="#4a5a6a" text-anchor="middle">最优 vs 生产</text>

  <!-- winner -->
  <rect x="880" y="62" width="140" height="84" rx="8" fill="#e8f6ee" stroke="#3b9a68" stroke-width="1.4"/>
  <text x="950" y="92" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">优胜者</text>
  <text x="950" y="113" font-size="12.5" fill="#4a5a6a" text-anchor="middle">报告 +</text>
  <text x="950" y="131" font-size="12.5" fill="#4a5a6a" text-anchor="middle">merge request</text>

  <!-- stage arrows -->
  <line x1="180" y1="104" x2="218" y2="104" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="640" y1="104" x2="688" y2="104" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="840" y1="104" x2="878" y2="104" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
</svg>
