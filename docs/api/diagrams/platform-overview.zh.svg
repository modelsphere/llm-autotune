<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#eef3f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172b4d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#55708f"/>
    </marker>
    <style>
      .title{font:700 42px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b4d}
      .subtitle{font:400 22px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#60758d}
      .section{font:700 26px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#29445f}
      .box-title{font:700 25px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172b4d}
      .box-text{font:400 20px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#49627b}
      .flow-title{font:700 23px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#173b63}
      .flow-text{font:400 19px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#49627b}
      .small{font:400 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#60758d}
    </style>
  </defs>
  <rect width="2000" height="1125" fill="url(#bg)"/>
  <text x="100" y="85" class="title">LLM AutoTune 平台总览</text>
  <text x="100" y="125" class="subtitle">策略负责探索，平台负责执行、测量和公平比较</text>

  <text x="100" y="190" class="section">高层架构</text>
  <g filter="url(#shadow)">
    <rect x="100" y="225" width="270" height="150" rx="18" fill="#ffffff" stroke="#b8cbe0" stroke-width="2"/>
    <text x="235" y="275" text-anchor="middle" class="box-title">用户 / 运维</text>
    <text x="235" y="315" text-anchor="middle" class="box-text">创建任务与竞赛</text>
    <text x="235" y="345" text-anchor="middle" class="box-text">查看进度与结果</text>

    <rect x="465" y="225" width="300" height="150" rx="18" fill="#e8f2ff" stroke="#83acd8" stroke-width="2"/>
    <text x="615" y="275" text-anchor="middle" class="box-title">平台 API</text>
    <text x="615" y="315" text-anchor="middle" class="box-text">统一控制面</text>
    <text x="615" y="345" text-anchor="middle" class="box-text">面向 UI 和搜索策略</text>

    <rect x="860" y="225" width="300" height="150" rx="18" fill="#fff4df" stroke="#e1b15c" stroke-width="2"/>
    <text x="1010" y="275" text-anchor="middle" class="box-title">Supervisor</text>
    <text x="1010" y="315" text-anchor="middle" class="box-text">持续推进任务状态</text>
    <text x="1010" y="345" text-anchor="middle" class="box-text">从数据库恢复进度</text>

    <rect x="1255" y="225" width="280" height="150" rx="18" fill="#edf8ef" stroke="#88bf91" stroke-width="2"/>
    <text x="1395" y="275" text-anchor="middle" class="box-title">Postgres</text>
    <text x="1395" y="315" text-anchor="middle" class="box-text">持久化状态</text>
    <text x="1395" y="345" text-anchor="middle" class="box-text">任务、运行与结果</text>

    <rect x="1630" y="225" width="270" height="150" rx="18" fill="#f2ecff" stroke="#aa92d6" stroke-width="2"/>
    <text x="1765" y="275" text-anchor="middle" class="box-title">GPU 执行环境</text>
    <text x="1765" y="315" text-anchor="middle" class="box-text">策略容器 + engine</text>
    <text x="1765" y="345" text-anchor="middle" class="box-text">LLMBench 负责测量</text>
  </g>
  <path d="M370 300 H455" stroke="#55708f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M765 300 H850" stroke="#55708f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1160 300 H1245" stroke="#55708f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1535 300 H1620" stroke="#55708f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1000" y="420" text-anchor="middle" class="small">平台统一管理资源和测量，策略只决定下一组要尝试的配置</text>

  <text x="100" y="520" class="section">统一流程</text>
  <g filter="url(#shadow)">
    <rect x="100" y="565" width="270" height="170" rx="18" fill="#ffffff" stroke="#b8cbe0" stroke-width="2"/>
    <text x="235" y="615" text-anchor="middle" class="flow-title">1. 定义目标</text>
    <text x="235" y="655" text-anchor="middle" class="flow-text">model、engine、</text>
    <text x="235" y="685" text-anchor="middle" class="flow-text">搜索空间与预算</text>

    <rect x="470" y="565" width="270" height="170" rx="18" fill="#e8f2ff" stroke="#83acd8" stroke-width="2"/>
    <text x="605" y="615" text-anchor="middle" class="flow-title">2. 策略探索</text>
    <text x="605" y="655" text-anchor="middle" class="flow-text">提出候选配置</text>
    <text x="605" y="685" text-anchor="middle" class="flow-text">平台启动并测量</text>

    <rect x="840" y="565" width="270" height="170" rx="18" fill="#fff4df" stroke="#e1b15c" stroke-width="2"/>
    <text x="975" y="615" text-anchor="middle" class="flow-title">3. 统一验证</text>
    <text x="975" y="655" text-anchor="middle" class="flow-text">固定数据集与条件</text>
    <text x="975" y="685" text-anchor="middle" class="flow-text">平台重新测量最佳候选</text>

    <rect x="1210" y="565" width="270" height="170" rx="18" fill="#edf8ef" stroke="#88bf91" stroke-width="2"/>
    <text x="1345" y="615" text-anchor="middle" class="flow-title">4. 记录结果</text>
    <text x="1345" y="655" text-anchor="middle" class="flow-text">保存可验证的分数</text>
    <text x="1345" y="685" text-anchor="middle" class="flow-text">释放并恢复机器</text>

    <rect x="1580" y="565" width="320" height="170" rx="18" fill="#f2ecff" stroke="#aa92d6" stroke-width="2"/>
    <text x="1740" y="615" text-anchor="middle" class="flow-title">5. 比较与决策</text>
    <text x="1740" y="655" text-anchor="middle" class="flow-text">单个调优任务产出结果</text>
    <text x="1740" y="685" text-anchor="middle" class="flow-text">竞赛比较多个策略</text>
  </g>
  <path d="M370 650 H460" stroke="#55708f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M740 650 H830" stroke="#55708f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1110 650 H1200" stroke="#55708f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1480 650 H1570" stroke="#55708f" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="100" y="825" width="1800" height="190" rx="22" fill="#ffffff" stroke="#c9d6e4" stroke-width="2"/>
  <text x="145" y="875" class="section">两种运行模式</text>
  <circle cx="175" cy="930" r="11" fill="#4e8ed0"/><text x="205" y="938" class="box-text"><tspan font-weight="700">调优任务：</tspan>一个策略探索一个 model 的部署配置空间，产出经平台验证的最佳结果。</text>
  <circle cx="175" cy="975" r="11" fill="#9a78c7"/><text x="205" y="983" class="box-text"><tspan font-weight="700">竞赛：</tspan>多个策略在相同 model、数据集、benchmark、机器和预算下运行，按统一测量公平比较。</text>
</svg>
