<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b6b7a"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b72be"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6f4f"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c07a2c"/>
    </marker>
  </defs>

  <rect width="1080" height="500" fill="#ffffff"/>

  <!-- left column -->
  <rect x="20" y="60" width="120" height="66" rx="8" fill="#eef1f5" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="80" y="88" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Browser</text>
  <text x="80" y="109" font-size="12.5" fill="#5b6b7a" text-anchor="middle">operators</text>

  <rect x="20" y="230" width="120" height="66" rx="8" fill="#eef1f5" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="80" y="258" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Deploy repo</text>
  <text x="80" y="279" font-size="12.5" fill="#5b6b7a" text-anchor="middle">serving config</text>

  <!-- platform -->
  <rect x="240" y="20" width="360" height="430" rx="10" fill="#f5f8fc" stroke="#b8c4d0" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="258" y="42" font-size="12.5" font-weight="700" fill="#4a5a6a" letter-spacing="0.6">LLM AUTOTUNE</text>

  <rect x="260" y="60" width="320" height="66" rx="8" fill="#e4edf9" stroke="#5b85c9" stroke-width="1.4"/>
  <text x="420" y="88" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">API</text>
  <text x="420" y="109" font-size="12.5" fill="#4a5a6a" text-anchor="middle">UI · REST · policy API</text>

  <rect x="260" y="220" width="320" height="86" rx="8" fill="#e4edf9" stroke="#5b85c9" stroke-width="1.4"/>
  <text x="420" y="256" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Supervisor</text>
  <text x="420" y="278" font-size="12.5" fill="#4a5a6a" text-anchor="middle">control loop, every ~10 s</text>

  <rect x="260" y="360" width="150" height="62" rx="8" fill="#ece6f6" stroke="#8b72be" stroke-width="1.4"/>
  <text x="335" y="387" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Postgres</text>
  <text x="335" y="407" font-size="12.5" fill="#4a5a6a" text-anchor="middle">all state</text>

  <rect x="430" y="360" width="150" height="62" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="505" y="387" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Plugins</text>
  <text x="505" y="407" font-size="12.5" fill="#4a5a6a" text-anchor="middle">optional</text>

  <!-- GPU machines -->
  <rect x="750" y="20" width="310" height="320" rx="10" fill="#f7f8fa" stroke="#c4ccd4" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="768" y="42" font-size="12.5" font-weight="700" fill="#4a5a6a" letter-spacing="0.6">GPU MACHINES</text>
  <text x="1042" y="42" font-size="12" fill="#7a8794" text-anchor="end">Kubernetes or ssh</text>

  <rect x="772" y="60" width="266" height="66" rx="8" fill="#d9f0e2" stroke="#2f6f4f" stroke-width="2.4"/>
  <text x="905" y="88" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Policy container</text>
  <text x="905" y="109" font-size="12.5" fill="#2f4f3f" text-anchor="middle">your search algorithm</text>

  <rect x="782" y="260" width="266" height="66" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.2"/>
  <rect x="772" y="250" width="266" height="66" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.4"/>
  <text x="905" y="278" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">Engines</text>
  <text x="905" y="299" font-size="12.5" fill="#4a5a6a" text-anchor="middle">sglang or vLLM, one per config</text>

  <!-- LLMBench -->
  <rect x="750" y="384" width="310" height="66" rx="8" fill="#fdf0e1" stroke="#d9a35f" stroke-width="1.4"/>
  <text x="905" y="412" font-size="15" font-weight="700" fill="#1b2733" text-anchor="middle">LLMBench</text>
  <text x="905" y="433" font-size="12.5" fill="#4a5a6a" text-anchor="middle">benchmark platform</text>

  <!-- arrows and their labels -->
  <g font-size="12">
    <line x1="140" y1="93" x2="258" y2="93" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="199" y="84" fill="#5b6b7a" text-anchor="middle">campaigns</text>

    <line x1="260" y1="263" x2="142" y2="263" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="199" y="254" fill="#5b6b7a" text-anchor="middle">winner as MR</text>

    <line x1="335" y1="308" x2="335" y2="358" stroke="#8b72be" stroke-width="1.6" marker-start="url(#arrp)" marker-end="url(#arrp)"/>

    <line x1="772" y1="90" x2="582" y2="90" stroke="#2f6f4f" stroke-width="2.4" marker-end="url(#arrg)"/>
    <text x="675" y="80" fill="#2f6f4f" font-weight="700" text-anchor="middle">asks for runs</text>
    <text x="675" y="108" fill="#2f6f4f" font-weight="700" text-anchor="middle">reports its best</text>

    <path d="M580 236 H905 V128" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="675" y="227" fill="#5b6b7a" text-anchor="middle">starts it</text>

    <line x1="580" y1="283" x2="770" y2="283" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="675" y="274" fill="#5b6b7a" text-anchor="middle">launches configs</text>

    <path d="M580 298 H650 V417 H748" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="699" y="408" fill="#5b6b7a" text-anchor="middle">benchmarks</text>

    <line x1="980" y1="384" x2="980" y2="328" stroke="#c07a2c" stroke-width="1.6" marker-end="url(#arro)"/>
    <text x="988" y="361" fill="#c07a2c">load</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#4a5a6a">
    <rect x="240" y="473" width="14" height="14" rx="3" fill="#d9f0e2" stroke="#2f6f4f" stroke-width="1.6"/>
    <text x="260" y="484">search (yours)</text>
    <rect x="378" y="473" width="14" height="14" rx="3" fill="#e4edf9" stroke="#5b85c9" stroke-width="1.4"/>
    <text x="398" y="484">control (the platform)</text>
    <rect x="550" y="473" width="14" height="14" rx="3" fill="#fdf0e1" stroke="#d9a35f" stroke-width="1.4"/>
    <text x="570" y="484">measurement (LLMBench)</text>
  </g>
</svg>
