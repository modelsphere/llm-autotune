<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1125" viewBox="0 0 2000 1125">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#edf2f7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#19324b" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#607d9a"/></marker>
    <style>
      .title{font:700 44px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18324d}
      .sub{font:400 23px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#647b91}
      .layer{font:700 28px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18324d}
      .head{font:700 25px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#18324d}
      .text{font:400 20px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#4f6880}
      .note{font:400 19px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#526b82}
    </style>
  </defs>
  <rect width="2000" height="1125" fill="url(#bg)"/>
  <text x="100" y="82" class="title">LLM AutoTune 平台架构</text>
  <text x="100" y="123" class="sub">竞赛编排搜索策略，平台控制执行与测量，GPU 机器承载实际运行</text>

  <!-- business layer -->
  <g filter="url(#shadow)">
    <rect x="100" y="190" width="1420" height="190" rx="24" fill="#eee8ff" stroke="#a98dd4" stroke-width="3"/>
    <text x="150" y="245" class="layer">业务层：竞赛 / 调优任务</text>
    <text x="150" y="292" class="head">竞赛统一条件，组织多个参赛项</text>
    <text x="150" y="330" class="text">固定 model、benchmark、回放数据集、机器池与预算；每个参赛项对应一个调优任务，</text>
    <text x="150" y="360" class="text">最终只比较平台在统一条件下产生的正式评测结果。</text>
  </g>

  <!-- control plane -->
  <g filter="url(#shadow)">
    <rect x="100" y="440" width="1420" height="245" rx="24" fill="#fff4df" stroke="#ddb05a" stroke-width="3"/>
    <text x="150" y="495" class="layer">平台控制面</text>
    <rect x="150" y="530" width="265" height="105" rx="14" fill="#ffffff" stroke="#c6d3df" stroke-width="2"/>
    <text x="282" y="573" text-anchor="middle" class="head">平台 API</text>
    <text x="282" y="605" text-anchor="middle" class="note">UI 与策略的统一入口</text>
    <rect x="455" y="530" width="265" height="105" rx="14" fill="#ffffff" stroke="#c6d3df" stroke-width="2"/>
    <text x="587" y="573" text-anchor="middle" class="head">Supervisor</text>
    <text x="587" y="605" text-anchor="middle" class="note">推进状态与资源调度</text>
    <rect x="760" y="530" width="265" height="105" rx="14" fill="#ffffff" stroke="#c6d3df" stroke-width="2"/>
    <text x="892" y="573" text-anchor="middle" class="head">Postgres</text>
    <text x="892" y="605" text-anchor="middle" class="note">持久化任务与结果</text>
    <rect x="1065" y="530" width="390" height="105" rx="14" fill="#ffffff" stroke="#c6d3df" stroke-width="2"/>
    <text x="1260" y="573" text-anchor="middle" class="head">资源与评测编排</text>
    <text x="1260" y="605" text-anchor="middle" class="note">启动、检查、测量、回收</text>
  </g>

  <!-- execution layer -->
  <g filter="url(#shadow)">
    <rect x="100" y="745" width="1420" height="230" rx="24" fill="#e8f6eb" stroke="#83bb8d" stroke-width="3"/>
    <text x="150" y="800" class="layer">执行层：GPU 机器</text>
    <rect x="150" y="835" width="390" height="95" rx="14" fill="#e5f1ff" stroke="#79a8d7" stroke-width="2"/>
    <text x="345" y="875" text-anchor="middle" class="head">策略容器</text>
    <text x="345" y="906" text-anchor="middle" class="note">搜索配置、提交候选、发送 heartbeat</text>
    <rect x="590" y="835" width="390" height="95" rx="14" fill="#ffffff" stroke="#b7c8d8" stroke-width="2"/>
    <text x="785" y="875" text-anchor="middle" class="head">engine 容器</text>
    <text x="785" y="906" text-anchor="middle" class="note">按候选配置提供推理服务</text>
    <rect x="1030" y="835" width="425" height="95" rx="14" fill="#ffffff" stroke="#b7c8d8" stroke-width="2"/>
    <text x="1242" y="875" text-anchor="middle" class="head">GPU / 机器资源</text>
    <text x="1242" y="906" text-anchor="middle" class="note">由平台预留、隔离、恢复和交还</text>
  </g>

  <!-- external measurement -->
  <g filter="url(#shadow)">
    <rect x="1600" y="440" width="300" height="245" rx="24" fill="#f2ecff" stroke="#aa92d6" stroke-width="3"/>
    <text x="1750" y="500" text-anchor="middle" class="layer">外部测量</text>
    <text x="1750" y="555" text-anchor="middle" class="head">LLMBench</text>
    <text x="1750" y="595" text-anchor="middle" class="note">施加回放负载</text>
    <text x="1750" y="628" text-anchor="middle" class="note">返回 benchmark 结果</text>
  </g>

  <!-- relations -->
  <path d="M810 390 V430" stroke="#607d9a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M810 695 V735" stroke="#607d9a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1525 565 H1588" stroke="#607d9a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1455 882 H1588" stroke="#607d9a" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1510" y="548" text-anchor="end" class="note">平台提交 benchmark、轮询结果</text>
  <text x="1510" y="865" text-anchor="end" class="note">平台测量 engine</text>
  <text x="1000" y="1045" text-anchor="middle" class="sub">策略决定尝试什么；平台决定如何运行、验证和形成最终结果</text>
</svg>
