<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6b7a"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6f4f"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c07a2c"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b72be"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c96161"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b85c9"/></marker></defs>
  <rect width="1040" height="330" fill="#ffffff"/>
  <rect x="20" y="20" width="660" height="290" rx="10" fill="#f7f8fa" stroke="#c4ccd4" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="38" y="42" font-size="12.5" fill="#4a5a6a" font-weight="700" letter-spacing="0.6" text-anchor="start">POLICY 容器</text>
  <text x="662" y="42" font-size="12" fill="#7a8794" text-anchor="end">在 GPU 机器上</text>
  <rect x="40" y="60" width="180" height="76" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="130.0" y="93.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">读取 manifest</text>
  <text x="130.0" y="114.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">model、space、截止时间</text>
  <rect x="260" y="60" width="180" height="76" rx="8" fill="#d9f0e2" stroke="#2f6f4f" stroke-width="2.4"/>
  <text x="350.0" y="84.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">挑选配置</text>
  <text x="350.0" y="105.5" font-size="12.5" fill="#2f4f3f" text-anchor="middle">随机、规则，</text>
  <text x="350.0" y="123.5" font-size="12.5" fill="#2f4f3f" text-anchor="middle">或基于历史结果</text>
  <rect x="480" y="60" width="180" height="76" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="570.0" y="93.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">运行</text>
  <text x="570.0" y="114.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">请平台执行</text>
  <rect x="480" y="200" width="180" height="76" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="570.0" y="233.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">记录 + 排名</text>
  <text x="570.0" y="254.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">更新候选列表</text>
  <rect x="260" y="200" width="180" height="76" rx="8" fill="#fdf5e1" stroke="#d1a646" stroke-width="1.4"/>
  <text x="350.0" y="233.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">到截止时间？</text>
  <text x="350.0" y="254.5" font-size="12.5" fill="#7a5a1a" text-anchor="middle">heartbeat 告知</text>
  <rect x="40" y="200" width="180" height="76" rx="8" fill="#eef1f5" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="130.0" y="233.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">Finalize</text>
  <text x="130.0" y="254.5" font-size="12.5" fill="#5b6b7a" text-anchor="middle">清理并退出</text>
