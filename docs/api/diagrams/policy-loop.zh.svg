  <path d="M440 98 L478 98" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <path d="M570 136 L570 198" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <path d="M480 238 L442 238" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <path d="M260 238 L222 238" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <text x="241" y="229" font-size="12" fill="#5b6b7a" text-anchor="middle">是</text>
  <path d="M350 200 L350 138" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <text x="360" y="174" font-size="12" fill="#5b6b7a" text-anchor="start">否</text>
  <rect x="780" y="40" width="240" height="150" rx="8" fill="#e4edf9" stroke="#5b85c9" stroke-width="1.4"/>
  <text x="900.0" y="83.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">平台 API</text>
  <text x="900.0" y="104.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">启动 engine</text>
  <text x="900.0" y="122.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">运行 benchmark</text>
  <text x="900.0" y="140.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">下发指令</text>
  <text x="900.0" y="158.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">验证最优配置</text>
  <path d="M660 80 L778 80" fill="none" stroke="#2f6f4f" stroke-width="1.6" marker-end="url(#a-green)"/>
  <text x="730" y="71" font-size="12" fill="#2f6f4f" text-anchor="middle">请求</text>
  <path d="M780 116 L662 116" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <text x="730" y="134" font-size="12" fill="#5b6b7a" text-anchor="middle">结果</text>
</svg>
