<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6b7a"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6f4f"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c07a2c"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b72be"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c96161"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b85c9"/></marker></defs>
  <rect width="1000" height="410" fill="#ffffff"/>
  <rect x="20" y="20" width="470" height="370" rx="10" fill="#f7f8fa" stroke="#c4ccd4" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="38" y="42" font-size="12.5" fill="#4a5a6a" font-weight="700" letter-spacing="0.6" text-anchor="start">BARE METAL</text>
  <text x="472" y="42" font-size="12" fill="#7a8794" text-anchor="end">ssh + docker, leased to the platform</text>
  <rect x="40" y="62" width="430" height="60" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="255.0" y="87.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">1 · Lease</text>
  <text x="255.0" y="108.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">the machine is handed over free</text>
  <path d="M255 122 L255 140" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <rect x="40" y="142" width="430" height="60" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="255.0" y="167.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">2 · Run configs</text>
  <text x="255.0" y="188.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">docker run, one per config</text>
  <path d="M255 202 L255 220" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <rect x="40" y="222" width="430" height="60" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="255.0" y="247.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">3 · Serve</text>
  <text x="255.0" y="268.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">poll until it answers</text>
  <path d="M255 282 L255 300" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <rect x="40" y="302" width="430" height="60" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="255.0" y="327.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">4 · Remove</text>
  <text x="255.0" y="348.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">only the containers it started</text>
  <rect x="510" y="20" width="470" height="370" rx="10" fill="#f7f8fa" stroke="#c4ccd4" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="528" y="42" font-size="12.5" fill="#4a5a6a" font-weight="700" letter-spacing="0.6" text-anchor="start">KUBERNETES</text>
  <text x="962" y="42" font-size="12" fill="#7a8794" text-anchor="end">borrows idle GPUs</text>
  <rect x="530" y="62" width="430" height="60" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="745.0" y="87.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">1 · Submit</text>
  <text x="745.0" y="108.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">a Deployment or a TuningRun</text>
  <path d="M745 122 L745 140" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <rect x="530" y="142" width="430" height="60" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="745.0" y="167.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">2 · Schedule</text>
  <text x="745.0" y="188.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">the scheduler picks the node</text>
  <path d="M745 202 L745 220" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <rect x="530" y="222" width="430" height="60" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="745.0" y="247.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">3 · Serve</text>
  <text x="745.0" y="268.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">poll until it answers</text>
  <path d="M745 282 L745 300" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <rect x="530" y="302" width="430" height="60" rx="8" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="745.0" y="327.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">4 · Delete</text>
  <text x="745.0" y="348.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">when the run ends</text>
</svg>
