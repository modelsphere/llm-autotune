<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs><marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b6b7a"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6f4f"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c07a2c"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b72be"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c96161"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5b85c9"/></marker></defs>
  <rect width="1000" height="320" fill="#ffffff"/>
  <rect x="20" y="132" width="170" height="72" rx="8" fill="#eef1f5" stroke="#9aa7b4" stroke-width="1.2"/>
  <text x="105.0" y="163.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">生产流量</text>
  <text x="105.0" y="184.5" font-size="12.5" fill="#5b6b7a" text-anchor="middle">一直在变化</text>
  <rect x="290" y="20" width="220" height="56" rx="8" fill="#e4edf9" stroke="#5b85c9" stroke-width="1.4"/>
  <text x="400.0" y="52.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">平台</text>
  <rect x="290" y="122" width="220" height="92" rx="8" fill="#fdf0e1" stroke="#d9a35f" stroke-width="1.4"/>
  <text x="400.0" y="154.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">Dataset profile</text>
  <text x="400.0" y="175.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">在 LLMBench 上</text>
  <text x="400.0" y="193.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">只在被请求时构建</text>
  <path d="M190 168 L288 168" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <text x="239" y="159" font-size="12" fill="#5b6b7a" text-anchor="middle">采样</text>
  <path d="M400 76 L400 120" fill="none" stroke="#5b85c9" stroke-width="1.6" marker-end="url(#a-blue)"/>
  <text x="410" y="103" font-size="12" fill="#5b85c9" text-anchor="start">请求构建</text>
  <rect x="640" y="40" width="340" height="64" rx="8" fill="#e4edf9" stroke="#5b85c9" stroke-width="1.4"/>
  <text x="810.0" y="67.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">Campaign A</text>
  <text x="810.0" y="88.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">首次测量时 pin 住 build 7</text>
  <path d="M510 168 L570 168 L570 72 L638 72" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <text x="604" y="63" font-size="12" fill="#5b6b7a" text-anchor="middle">pin</text>
  <rect x="640" y="134" width="340" height="64" rx="8" fill="#e4edf9" stroke="#5b85c9" stroke-width="1.4"/>
  <text x="810.0" y="161.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">Campaign B，A 仍在运行</text>
  <text x="810.0" y="182.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">沿用 build 7：可与 A 比较</text>
  <path d="M510 168 L570 168 L570 166 L638 166" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <text x="604" y="157" font-size="12" fill="#5b6b7a" text-anchor="middle">沿用</text>
  <rect x="640" y="228" width="340" height="64" rx="8" fill="#e4edf9" stroke="#5b85c9" stroke-width="1.4"/>
  <text x="810.0" y="255.5" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">Campaign C，之后</text>
  <text x="810.0" y="276.5" font-size="12.5" fill="#4a5a6a" text-anchor="middle">开始时重建：build 8</text>
  <path d="M510 168 L570 168 L570 260 L638 260" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
  <text x="604" y="251" font-size="12" fill="#5b6b7a" text-anchor="middle">重建</text>
</svg>
