<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4f5a"/>
    </marker>
  </defs>
  <style>
    .zoneA { fill:#fdf3e0; stroke:#d0a85a; stroke-width:1.2; }
    .zoneB { fill:#e6f4ea; stroke:#57a06a; stroke-width:1.2; }
    .zoneC { fill:#eef0fb; stroke:#8f96d8; stroke-width:1.2; }
    .zlab  { font-size:13px; font-weight:bold; fill:#1f2430; text-anchor:middle; }
    .zsub  { font-size:11px; fill:#3a4050; text-anchor:middle; }
    .edge  { stroke:#4a4f5a; stroke-width:1.8; fill:none; }
    .cut   { stroke:#c96b6b; stroke-width:1.6; fill:none; stroke-dasharray:6 4; }
    .flag  { fill:#fbeaea; stroke:#c96b6b; stroke-width:1.3; }
    .flagt { font-size:11.5px; font-weight:bold; fill:#a23b3b; text-anchor:middle; }
    .note  { font-size:11px; fill:#3a4050; text-anchor:middle; }
    .tick  { font-size:11.5px; font-weight:bold; fill:#5c6270; text-anchor:middle; }
    .lab   { font-size:11px; fill:#333; text-anchor:middle; paint-order:stroke; stroke:#ffffff; stroke-width:3.5; }
    .dbox  { fill:#faf6df; stroke:#c8bd8a; stroke-width:1.2; }
    .dtitle{ font-size:11.5px; font-weight:bold; fill:#5c5320; text-anchor:middle; }
    .dsub  { font-size:10.5px; fill:#3a4050; text-anchor:middle; }
  </style>
  <rect x="0" y="0" width="1180" height="470" fill="#ffffff"/>

  <!-- repeat loop above the search zone -->
  <path class="edge" d="M580,208 C580,156 380,156 380,208" marker-end="url(#arr)"/>
  <text class="lab" x="480" y="148">propose → launch → benchmark → rank · repeats</text>

  <!-- roll the dataset to the latest traffic as the night opens -->
  <rect class="dbox" x="40" y="146" width="220" height="46" rx="6"/>
  <text class="dtitle" x="150" y="166">Roll the dataset first</text>
  <text class="dsub" x="150" y="182">a fresh sample of the day's traffic</text>
  <path class="edge" d="M150,192 V208" marker-end="url(#arr)"/>

  <!-- the night ribbon -->
  <rect class="zoneA" x="60"  y="210" width="180" height="80" rx="8"/>
  <text class="zlab" x="150" y="245">Take over</text>
  <text class="zsub" x="150" y="266">hand-off + capture</text>

  <rect class="zoneB" x="240" y="210" width="540" height="80"/>
  <text class="zlab" x="510" y="245">Search rounds</text>
  <text class="zsub" x="510" y="266">baseline canary · the funnel runs here</text>

  <rect class="zoneC" x="780" y="210" width="180" height="80"/>
  <text class="zlab" x="870" y="245">Wind down</text>
  <text class="zsub" x="870" y="266">teardown</text>

  <rect class="zoneA" x="960" y="210" width="160" height="80" rx="8"/>
  <text class="zlab" x="1040" y="245">Hand back</text>
  <text class="zsub" x="1040" y="266">restore + verify</text>

  <!-- hard cutoff gate -->
  <path class="cut" d="M780,164 V300"/>
  <rect class="flag" x="636" y="162" width="288" height="44" rx="6"/>
  <text class="flagt" x="780" y="181">Hard cutoff</text>
  <text class="note" x="780" y="198">no run starts unless it finishes by morning</text>

  <!-- time axis -->
  <path class="edge" d="M60,314 H1120" marker-end="url(#arr)"/>
  <text class="tick" x="60"   y="336">23:00</text>
  <text class="tick" x="590"  y="336">· · ·  the night  · · ·</text>
  <text class="tick" x="1120" y="336">08:00</text>

  <!-- notes below -->
  <text class="note" x="150" y="372">Machines leave production.</text>
  <text class="note" x="150" y="390">Production captured so it</text>
  <text class="note" x="150" y="408">can be restored.</text>

  <text class="note" x="510" y="372">The baseline canary re-runs production's own config as a control.</text>
  <text class="note" x="510" y="390">Every candidate is screened cheaply; only the best few are verified on</text>
  <text class="note" x="510" y="408">the night's freshly-rolled dataset. Two experiments never share a machine while</text>
  <text class="note" x="510" y="426">a measurement that counts is being taken.</text>

  <text class="note" x="1040" y="372">Production brought back and</text>
  <text class="note" x="1040" y="390">verified healthy before the box</text>
  <text class="note" x="1040" y="408">is returned. Morning report ready.</text>
</svg>
