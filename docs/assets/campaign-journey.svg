<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 490" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4f5a"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a6d1f"/>
    </marker>
  </defs>
  <style>
    .you  { fill:#e9ebfa; stroke:#8f96d8; stroke-width:1.3; }
    .plat { fill:#e6f4ea; stroke:#57a06a; stroke-width:1.3; }
    .fleet{ fill:#fdf3e0; stroke:#d0a85a; stroke-width:1.3; }
    .data { fill:#faf6df; stroke:#c8bd8a; stroke-width:1.4; }
    .prodx{ fill:#fdf3e0; stroke:#c99a4a; stroke-width:1.4; stroke-dasharray:6 4; }
    .ext  { fill:#f7f8fc; stroke:#9aa3b5; stroke-width:1.4; stroke-dasharray:6 4; }
    .ntitle { font-size:13px; font-weight:bold; fill:#1f2430; text-anchor:middle; }
    .nsub { font-size:11px; fill:#3a4050; text-anchor:middle; }
    .tag { font-size:10.5px; font-weight:bold; text-anchor:middle; }
    .edge { stroke:#4a4f5a; stroke-width:2; fill:none; }
    .flow { stroke:#8a6d1f; stroke-width:2; fill:none; }
    .leg { font-size:11.5px; fill:#3a4050; }
    .lab { font-size:10.5px; fill:#333; text-anchor:middle; paint-order:stroke; stroke:#ffffff; stroke-width:3.5; }
    .glab{ font-size:11px; font-weight:bold; fill:#8a6d1f; text-anchor:middle; paint-order:stroke; stroke:#ffffff; stroke-width:3.5; }
    .cap { font-size:11.5px; fill:#5c6270; text-anchor:middle; font-style:italic; }
  </style>
  <rect x="0" y="0" width="1180" height="490" fill="#ffffff"/>

  <!-- legend -->
  <rect class="you"   x="230" y="24" width="18" height="14" rx="3"/>
  <text class="leg" x="254" y="36">User</text>
  <rect class="plat"  x="330" y="24" width="18" height="14" rx="3"/>
  <text class="leg" x="354" y="36">The platform</text>
  <rect class="fleet" x="480" y="24" width="18" height="14" rx="3"/>
  <text class="leg" x="504" y="36">Fleet / ops</text>
  <rect class="data"  x="610" y="24" width="18" height="14" rx="3"/>
  <text class="leg" x="634" y="36">Dataset</text>
  <rect class="ext"   x="722" y="24" width="18" height="14" rx="3"/>
  <text class="leg" x="746" y="36">outside our system</text>

  <!-- step 1 -->
  <rect class="you" x="42" y="70" width="195" height="180" rx="8"/>
  <text class="tag" x="139" y="94" fill="#5b5fb0">USER</text>
  <text class="ntitle" x="139" y="120">1 · Define</text>
  <text class="nsub" x="139" y="146">model + engine</text>
  <text class="nsub" x="139" y="166">machines to borrow</text>
  <text class="nsub" x="139" y="186">search space (the knobs)</text>
  <text class="nsub" x="139" y="206">objective + redlines</text>
  <text class="nsub" x="139" y="226">nightly schedule</text>

  <!-- step 2 -->
  <rect class="fleet" x="267" y="70" width="195" height="180" rx="8"/>
  <text class="tag" x="364" y="94" fill="#a9791f">FLEET</text>
  <text class="ntitle" x="364" y="120">2 · Borrow machines</text>
  <text class="nsub" x="364" y="150">at night, machines</text>
  <text class="nsub" x="364" y="170">leave production</text>
  <text class="nsub" x="364" y="198">production is captured</text>
  <text class="nsub" x="364" y="218">so it can be restored</text>

  <!-- step 3 -->
  <rect class="plat" x="492" y="70" width="195" height="180" rx="8"/>
  <text class="tag" x="589" y="94" fill="#3f7d54">PLATFORM</text>
  <text class="ntitle" x="589" y="120">3 · Tune, night</text>
  <text class="ntitle" x="589" y="138">after night</text>
  <text class="nsub" x="589" y="164">launch a config,</text>
  <text class="nsub" x="589" y="184">benchmark, rank</text>
  <text class="nsub" x="589" y="204">cheap checks first</text>
  <text class="nsub" x="589" y="224">resumes each evening</text>

  <!-- step 4 -->
  <rect class="you" x="717" y="70" width="195" height="180" rx="8"/>
  <text class="tag" x="814" y="94" fill="#5b5fb0">USER</text>
  <text class="ntitle" x="814" y="120">4 · Read the report</text>
  <text class="nsub" x="814" y="152">did anything beat</text>
  <text class="nsub" x="814" y="172">production?</text>
  <text class="nsub" x="814" y="200">leaderboard, failures,</text>
  <text class="nsub" x="814" y="220">what to do next</text>

  <!-- step 5 -->
  <rect class="you" x="942" y="70" width="195" height="180" rx="8"/>
  <text class="tag" x="1039" y="94" fill="#5b5fb0">USER → CICD</text>
  <text class="ntitle" x="1039" y="120">5 · Promote the</text>
  <text class="ntitle" x="1039" y="138">winner</text>
  <text class="nsub" x="1039" y="170">the exact winning</text>
  <text class="nsub" x="1039" y="190">config is handed</text>
  <text class="nsub" x="1039" y="210">to CICD to roll out</text>

  <!-- step arrows 1..5 -->
  <path class="edge" d="M237,160 H263" marker-end="url(#arr)"/>
  <path class="edge" d="M462,160 H488" marker-end="url(#arr)"/>
  <path class="edge" d="M687,160 H713" marker-end="url(#arr)"/>
  <path class="edge" d="M912,160 H938" marker-end="url(#arr)"/>

  <!-- ============ the loop that keeps the dataset fresh ============ -->

  <!-- 5 -> 6 : the winner goes live -->
  <path class="edge" d="M1039,250 V330" marker-end="url(#arr)"/>
  <text class="lab" x="1039" y="292">goes live</text>

  <!-- step 6 · production (not ours) -->
  <rect class="prodx" x="942" y="330" width="195" height="104" rx="8"/>
  <text class="tag" x="1039" y="352" fill="#a9791f">NOT OURS</text>
  <text class="ntitle" x="1039" y="376">6 · In production</text>
  <text class="nsub" x="1039" y="400">the winner serves</text>
  <text class="nsub" x="1039" y="420">live traffic, all day</text>

  <!-- collector runs alongside production -->
  <rect class="ext" x="650" y="330" width="200" height="104" rx="8"/>
  <text class="tag" x="750" y="352" fill="#6b7280">ALWAYS ON</text>
  <text class="ntitle" x="750" y="376">Dataset collector</text>
  <text class="nsub" x="750" y="400">alongside production,</text>
  <text class="nsub" x="750" y="420">quietly samples live traffic</text>

  <!-- the rolling dataset it produces (ours to pin & measure with) -->
  <rect class="data" x="350" y="330" width="220" height="104" rx="8"/>
  <text class="ntitle" x="460" y="368">Rolling replay dataset</text>
  <text class="nsub" x="460" y="392">rebuilt from the freshest</text>
  <text class="nsub" x="460" y="412">traffic, ready for the night</text>

  <!-- 6 -> collector -> dataset (right to left) -->
  <path class="flow" d="M942,382 H852" marker-end="url(#arrg)"/>
  <text class="glab" x="897" y="372">live traffic</text>
  <path class="flow" d="M650,382 H572" marker-end="url(#arrg)"/>
  <text class="glab" x="611" y="372">builds</text>

  <!-- dataset -> feeds in between step 2 and step 3 -->
  <path class="flow" d="M477,330 V174" marker-end="url(#arrg)"/>
  <text class="glab" x="477" y="300">a fresh dataset for tonight</text>

  <!-- framing caption -->
  <text class="cap" x="590" y="466">Between our campaigns the model just serves — and its live traffic quietly becomes the next night's dataset.</text>
</svg>
