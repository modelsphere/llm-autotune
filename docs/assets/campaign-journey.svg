  <text x="542.0" y="100.0" font-size="12.5" fill="#4a5a6a" text-anchor="middle">night after night,</text>
  <text x="542.0" y="118.0" font-size="12.5" fill="#4a5a6a" text-anchor="middle">resumes each evening</text>
  <path d="M632 84 L666 84" fill="none" stroke="#5b6b7a" stroke-width="1.6" marker-end="url(#a-grey)"/>
