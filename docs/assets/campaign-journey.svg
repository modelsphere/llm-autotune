  <text x="326.0" y="79.0" font-size="15" fill="#1b2733" font-weight="700" text-anchor="middle">2 · Lend machines</text>
  <text x="326.0" y="100.0" font-size="12.5" fill="#7a5a1a" text-anchor="middle">production machines,</text>
  <text x="326.0" y="118.0" font-size="12.5" fill="#7a5a1a" text-anchor="middle">for a nightly window</text>
